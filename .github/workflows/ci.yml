name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Formatting (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Pinned: clang-format's versions disagree on some layouts.
      - name: Check formatting
        run: |
          pipx run --spec clang-format==20.1.8 clang-format --dry-run --Werror \
            $(git ls-files '*.cpp' '*.hpp' '*.h')

  linux-lavapipe:
    name: Linux (lavapipe, validation on)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install dependencies
        run: bash tools/install-deps-ubuntu.sh

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Device report
        run: ./build/ci/apps/vkml-info

      - name: Build as another project's dependency
        run: |
          cmake -S tools/consumer -B build/consumer -G Ninja
          cmake --build build/consumer
          ./build/consumer/quickstart

  windows-msys2:
    name: Windows (MSYS2 UCRT64, tests that need no GPU)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-shaderc

      - name: Configure
        run: cmake --preset ci -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build --preset ci

      # The runner has no GPU, and MSYS2 has no software Vulkan: run the
      # tokenizer, template, sampling and API tests, which need no device.
      - name: Test
        run: >-
          ./build/ci/tests/vkml_tests.exe
          "[chat],[jinja],[openai],[pretokenize],[sampling],[tokenizer],[unicode]"
